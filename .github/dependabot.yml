version: 2

# Majors are deliberate migrations, not pull requests. Ignore them here and
# bump them by hand with the build file, so the catalog never jumps a Kotlin,
# AGP, or TypeScript major without a baseline decision.
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - area:android
    commit-message:
      prefix: "build"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      androidx:
        patterns:
          - "androidx.*"
      compose:
        patterns:
          - "*compose*"
      testing:
        patterns:
          - "*junit*"
          - "*test*"

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - area:backend
    commit-message:
      prefix: "build"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cloudflare:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
          - "workerd"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - area:release
    commit-message:
      prefix: "ci"
