version: 2

updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - area:android
    commit-message:
      prefix: "build"
    groups:
      androidx:
        patterns:
          - "androidx.*"
      compose:
        patterns:
          - "*compose*"
      kotlin:
        patterns:
          - "*kotlin*"
          - "*ksp*"
      testing:
        patterns:
          - "*junit*"
          - "*test*"

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - area:backend
    commit-message:
      prefix: "build"
    groups:
      cloudflare:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
          - "workerd"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - area:release
    commit-message:
      prefix: "ci"
