name: Release

# Cut a release by pushing a semver tag: git tag v0.2.0 && git push origin v0.2.0
# The tag supplies versionName. versionCode is the workflow run number, which
# only moves forward, as Play Console requires.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  bundle:
    name: Signed bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Require signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured. See CONTRIBUTING.md."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Bundle release
        run: |
          ./gradlew bundleRelease \
            -Phypertrophy.versionName="${GITHUB_REF_NAME#v}" \
            -Phypertrophy.versionCode="$GITHUB_RUN_NUMBER" \
            --stacktrace

      - name: Verify bundle
        run: |
          test -f app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/bundle/release/

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Hypertrophy $GITHUB_REF_NAME" \
            --generate-notes \
            app/build/outputs/bundle/release/app-release.aab

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: hypertrophy-aab-${{ github.ref_name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
