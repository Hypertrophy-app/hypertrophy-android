name = "hypertrophy-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "hypertrophy-db"
database_id = "ba6939cc-125a-4e08-82ab-ee1fb4f05cab"
migrations_dir = "drizzle/migrations"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "hypertrophy-assets"

[[durable_objects.bindings]]
name = "SQUAD_ROOM"
class_name = "SquadRoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SquadRoomDO"]

[vars]
ENVIRONMENT = "production"
# No custom domain is owned yet, so the Worker is served from its workers.dev
# host. This is the only origin that can legitimately produce an azp claim;
# Clerk native tokens omit azp entirely, so the check never fires for the app.
CLERK_AUTHORIZED_PARTIES = "https://hypertrophy-api.watchllm.workers.dev"

[observability]
enabled = true
head_sampling_rate = 1.0
