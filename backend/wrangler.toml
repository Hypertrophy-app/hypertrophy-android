name = "hypertrophy-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "hypertrophy-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle/migrations"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "hypertrophy-assets"

[[durable_objects.bindings]]
name = "SQUAD_ROOM"
class_name = "SquadRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SquadRoom"]

[vars]
ENVIRONMENT = "development"
CLERK_AUTHORIZED_PARTIES = "https://api.hypertrophy.app"

[observability]
enabled = true
head_sampling_rate = 1.0
